<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mind-elixir-export-svg demo</title>
    <link rel="stylesheet" href="dist/mind-elixir.css" />
    <style>
      body {
        margin: 0;
        font:
          14px system-ui,
          sans-serif;
        color: #222;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid #ddd;
      }
      header label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: calc(100vh - 50px);
      }
      #editor,
      #preview {
        overflow: auto;
        min-width: 0;
      }
      #editor {
        border-right: 1px solid #ddd;
      }
      #map {
        width: 100%;
        height: 100%;
      }
      #preview {
        padding: 12px;
        background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0 / 20px 20px;
      }
      #preview img {
        width: 100%;
        height: auto;
      }
      #warnings {
        margin: 0;
        padding-left: 18px;
        color: #8a4b00;
      }
      @media (max-width: 800px) {
        main {
          grid-template-columns: 1fr;
          grid-auto-rows: 50vh;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <label
        >Map
        <select id="fixture"></select
      ></label>
      <label
        >Layout
        <select id="direction">
          <option value="2">Both sides</option>
          <option value="1">Right</option>
          <option value="0">Left</option>
          <option value="3">Top-down</option>
        </select>
      </label>
      <label><input type="checkbox" id="dark" /> Dark theme</label>
      <label>Zoom <input type="range" id="zoom" min="0.3" max="2" step="0.05" value="1" /></label>
      <button id="export">Export SVG</button>
      <button id="download">Download</button>
      <span id="size" aria-live="polite"></span>
    </header>
    <main>
      <section id="editor" aria-label="Mind Elixir editor"><div id="map"></div></section>
      <section id="preview" aria-label="Exported SVG">
        <ul id="warnings" aria-live="polite"></ul>
        <img id="svg" alt="" />
      </section>
    </main>
    <script src="dist/demo.js"></script>
  </body>
</html>
